<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education Timeline - Vertical</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6 flex justify-center">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6">

    <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
       Education Timeline
    </h2>

    <!-- Timeline vertical -->
    <div class="space-y-5">

      <!-- Item 1 -->
      <div class="flex gap-4">
        <div class="flex flex-col items-center">
          <div class="w-3 h-3 bg-yellow-400 rounded-full mt-2"></div>
          <div class="w-0.5 h-full bg-yellow-200 min-h-[60px]"></div>
        </div>
        <div class="flex-1 pb-4">
          <span class="text-xs font-semibold text-yellow-600 bg-yellow-100 px-2 py-0.5 rounded-full">2016 – 2017</span>
          <h3 class="font-bold text-gray-800 mt-1">Elementary</h3>
          <p class="text-gray-500 text-sm">Achuchu</p>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="flex gap-4">
        <div class="flex flex-col items-center">
          <div class="w-3 h-3 bg-yellow-400 rounded-full mt-2"></div>
          <div class="w-0.5 h-full bg-yellow-200 min-h-[60px]"></div>
        </div>
        <div class="flex-1 pb-4">
          <span class="text-xs font-semibold text-yellow-600 bg-yellow-100 px-2 py-0.5 rounded-full">2017 – 2018</span>
          <h3 class="font-bold text-gray-800 mt-1">Elementary</h3>
          <p class="text-gray-500 text-sm">Another year / note</p>
        </div>
      </div>

      <!-- Item 3 -->
      <div class="flex gap-4">
        <div class="flex flex-col items-center">
          <div class="w-3 h-3 bg-yellow-400 rounded-full mt-2"></div>
        </div>
        <div class="flex-1">
          <span class="text-xs font-semibold text-yellow-600 bg-yellow-100 px-2 py-0.5 rounded-full">2018 – 2019</span>
          <h3 class="font-bold text-gray-800 mt-1">Elementary</h3>
          <p class="text-gray-500 text-sm">Final year of elementary</p>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
