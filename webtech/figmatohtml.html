<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Kafe</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;600&family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Marhey', sans-serif;
    }
  </style>
</head>

<body class="bg-white">

  <!-- HERO SECTION -->
  <section class="relative w-full h-screen flex items-center justify-center text-center">

    <!-- Background -->
    <img src="assets/bg for landing page.gif"
      class="absolute inset-0 w-full h-full object-cover opacity-80"
    />

    <!-- Content -->
    <div class="relative z-10 px-4">

      <!-- Title -->
      <h1 class="text-white text-4xl md:text-6xl lg:text-7xl font-semibold mb-6">
        My Kafe
      </h1>

      <!-- Button -->
      <button class="bg-yellow-400 text-black px-8 py-4 rounded-full text-xl md:text-2xl font-bold hover:scale-105 transition">
        Play Now!
      </button>

    </div>
  </section>


<!-- ABOUT SECTION -->
<section class="bg-yellow-400 py-16 px-6 md:px-16">

  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-10 items-center">

    <!-- Text -->
    <div>
      <h2 class="text-3xl md:text-5xl font-semibold mb-6">
        WHERE RELAXATION COMES TO LIFE
      </h2>
      <p class="text-lg md:text-xl">
        Welcome to My Kafe, where every cup is made with care and every customer leaves with a smile.
        Serve warm drinks, meet kind faces, and build a cozy café filled with simple, happy moments.
      </p>
    </div>

    <!-- Cropped Wood + Barista Character -->
    <div class="relative flex justify-center items-end min-h-[400px] rounded-xl overflow-hidden">
  
  <!-- Wood as TABLE (horizontal strip at the bottom) -->
         <img src="assets/wood.jpeg" 
             class="absolute bottom-100 left-100 w-full h-10 md:h-30 object-cover"
             style="object-position: center 30%;" />
  
  <!-- Barista/Character (sitting/standing on/near the table) -->
  <img src="assets/Trial Barista.gif" 
       class="relative z-10 w-auto h-64 md:h-72 object-contain mb-16" />
       
</div>
    </div>

  </div>
</section>


  <!-- DRINKS SECTION -->
  <section class="py-16 px-6 md:px-16 text-center">

    <h2 class="text-3xl md:text-5xl font-semibold mb-10">
      Drinks Available
    </h2>

    <!-- Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 max-w-6xl mx-auto">

      <div class="bg-gray-200 h-40 rounded-lg flex items-center justify-center">
        Coffee
      </div>

      <div class="bg-gray-200 h-40 rounded-lg flex items-center justify-center">
        Latte
      </div>

      <div class="bg-gray-200 h-40 rounded-lg flex items-center justify-center">
        Tea
      </div>

      <div class="bg-gray-200 h-40 rounded-lg flex items-center justify-center">
        Mocha
      </div>

    </div>
  </section>

</body>
</html>
