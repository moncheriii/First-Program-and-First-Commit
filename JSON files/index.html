<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>

    <form id="add_form">
      <input type="text" id="e_code" placeholder="Code" />
      <input type="text" id="e_name" placeholder="Name" />
      <input type="text" id="e_address" placeholder="Address" />
      <input type="number" id="e_age" placeholder="Age" />
      <input type="text" id="e_position" placeholder="Position" />
      <button type="submit">Add Employee</button>
    </form>

    <table border="1px solid black" style="border-collapse: collapse">
      <thead>
        <tr>
          <th>id</th>
          <th>employeeCode</th>
          <th>name</th>
          <th>address</th>
          <th>age</th>
          <th>position</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="data_output"></tbody>
    </table>

    <script src="script.js"></script>
  </body>
</html>
